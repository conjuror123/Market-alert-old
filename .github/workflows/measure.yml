name: Measure

# The dashboard: what the detector sends and what the vote decides, measured the same
# way every time the code changes (tools/measure.py), drawn as one page
# (tools/dashboard.py) and published on GitHub Pages. Every voter's bars of the last year
# are fetched afresh (tools/voter_bars.py) and every far move of that year is voted again
# by the code being measured. It writes nothing to the repository, reads nothing from an
# earlier run and keeps nothing for a later one. A measurement whose own checks fail
# stops the job before anything is published.
#
# Keys: only Alpaca's, for its tape. Never Tiingo, SiftingIO or Twelve Data - their
# quotas belong to the live run.
#
# Once, by hand: Settings -> Pages -> Source "GitHub Actions"; and in Settings ->
# Environments -> github-pages, the branches below allowed to deploy.

on:
  push:
    branches: [claude/youthful-pascal-u0rx7u]
    paths:
      - "jump/**"
      - "price_monitor/**"
      - "config/**"
      - "tools/**"
      - ".github/workflows/measure.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The month before this one may still be open for its first week; the live run
      # keeps the open months on its release (tools/hot_bars.sh).
      - name: Restore the open months of the bars
        env:
          GH_TOKEN: ${{ github.token }}
          BARS_BRANCH: ${{ github.event.repository.default_branch }}
        run: tools/hot_bars.sh restore

      # The voters' own reach decides how far each goes (MarketWatch 9 days, the FT 30,
      # Coinbase the whole year, ...). A source that fails is listed in failed.txt and
      # named on the page.
      - name: Fetch the voters' bars
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: PYTHONPATH=. python -m tools.voter_bars "$RUNNER_TEMP/voters" --days 365

      # Alpaca's keys again: without them the vote would not ask its tape.
      - name: Measure
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          PYTHONPATH=. python -m tools.measure "$RUNNER_TEMP/measure.json" \
            --voters "$RUNNER_TEMP/voters"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Draw the page
        run: |
          PYTHONPATH=. python -m tools.dashboard "$RUNNER_TEMP/measure.json" site

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
