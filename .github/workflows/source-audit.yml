name: Source audit

# One-off (deleted with tools/source_audit.py once the voters are wired): every source
# tried on every instrument, and on the Bund, the gilt, the JGB and TTF, from where the
# bot runs and with its keys. The store is read as the dashboard reads it: the checkout,
# the live run's open months, and the instruments the live run does not carry fetched
# up to now. Writes nothing to the repository: the matrix is printed and kept as an
# artifact.
#
# Keys within what the live run leaves (tools/source_audit.py): Tiingo at most 15 calls,
# Twelve Data outside the hourly batch's minutes, SiftingIO about 15, Alpaca's tape for
# the funds.

on:
  push:
    branches: [claude/youthful-pascal-u0rx7u]
    paths:
      - "tools/source_audit.py"
      - ".github/workflows/source-audit.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the open months of the bars
        env:
          GH_TOKEN: ${{ github.token }}
          BARS_BRANCH: ${{ github.event.repository.default_branch }}
        run: tools/hot_bars.sh restore

      - name: Fetch what the live run does not carry
        env:
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
        run: |
          names=$(PYTHONPATH=. python -c 'from tools.measure import not_carried; print(",".join(not_carried(keyed=("sifting",))))')
          echo "not carried by the live run: ${names:-none}"
          if [ -n "$names" ]; then
            PYTHONPATH=. python -m jump.backfill --live-pass --usage-purpose manual \
              --instruments "$names" || echo "::warning::the fetch failed"
          fi

      - name: Audit
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: PYTHONPATH=. python -W ignore -m tools.source_audit "$RUNNER_TEMP/audit"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit
          path: ${{ runner.temp }}/audit
